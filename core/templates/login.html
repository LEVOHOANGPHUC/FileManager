<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập - FileBox</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center h-screen font-sans">
    <div class="bg-white p-8 rounded-2xl shadow-sm ring-1 ring-gray-100 w-full max-w-md">
        <div class="flex justify-center mb-6">
            <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-blue-600 text-white">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-8 w-8">
                    <path d="M4 7V4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3M4 17v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3M2 12h20" />
                </svg>
            </div>
        </div>
        <h2 class="text-2xl font-bold text-center text-gray-900 mb-2">Chào mừng trở lại!</h2>
        <p class="text-center text-gray-500 mb-6 text-sm">Vui lòng đăng nhập vào tài khoản FileBox của bạn.</p>

        {% if error %}
        <div class="bg-red-50 text-red-600 p-3 rounded-xl mb-4 text-sm font-medium border border-red-100 text-center">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="">
            {% csrf_token %} <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Tên đăng nhập</label>
                <input type="text" name="username" required class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-600 outline-none bg-gray-50 transition-all">
            </div>
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-1">Mật khẩu</label>
                <input type="password" name="password" required class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-600 outline-none bg-gray-50 transition-all">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-2.5 rounded-xl hover:bg-blue-700 transition shadow-sm shadow-blue-600/20">Đăng nhập</button>
        </form>
        
        <p class="mt-6 text-center text-sm text-gray-600">
            Chưa có tài khoản? <a href="#" class="text-blue-600 font-medium hover:underline">Đăng ký ngay</a>
        </p>
    </div>
</body>
</html>
